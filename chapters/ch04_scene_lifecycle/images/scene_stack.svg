<svg xmlns="http://www.w3.org/2000/svg" width="720" height="360" viewBox="0 0 720 360" font-family="Arial, Helvetica, sans-serif">
  <rect width="720" height="360" fill="#ffffff"/>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1d3557"/></marker></defs>
  <text x="360" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#1b1f2a">Pause and HUD, with the pause menu open</text>

  <!-- stacked layers, bottom to top -->
  <polygon points="140,290 460,290 520,250 200,250" fill="#457b9d" stroke="#1d3557" stroke-width="2"/>
  <text x="330" y="276" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">GameScene</text>

  <polygon points="140,220 460,220 520,180 200,180" fill="#a8dadc" stroke="#1d3557" stroke-width="2" fill-opacity="0.9"/>
  <text x="330" y="206" text-anchor="middle" font-size="15" font-weight="bold" fill="#1b1f2a">HudScene</text>

  <polygon points="140,150 460,150 520,110 200,110" fill="#f4a261" stroke="#1d3557" stroke-width="2" fill-opacity="0.9"/>
  <text x="330" y="136" text-anchor="middle" font-size="15" font-weight="bold" fill="#1b1f2a">PauseScene</text>

  <text x="535" y="135" font-size="13" fill="#1b1f2a">RUNNING - reads P, R, Q</text>
  <text x="535" y="197" font-size="13" fill="#1b1f2a">RUNNING - shows score,</text>
  <text x="535" y="214" font-size="13" fill="#1b1f2a">lives and time</text>
  <text x="535" y="270" font-size="13" fill="#1b1f2a">PAUSED - drawn, frozen:</text>
  <text x="535" y="287" font-size="13" fill="#1b1f2a">no update, no timers, no keys</text>

  <path d="M100 300 L100 105" stroke="#1d3557" stroke-width="2.5" marker-end="url(#a)"/>
  <text x="90" y="210" text-anchor="middle" font-size="13" fill="#1d3557" transform="rotate(-90 90 210)">drawn in this order</text>

  <text x="360" y="330" text-anchor="middle" font-size="13" fill="#e63946">scene: [MenuScene, GameScene, HudScene, PauseScene] - later in the list means drawn on top</text>
</svg>
