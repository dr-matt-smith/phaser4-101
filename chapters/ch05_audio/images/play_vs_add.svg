<svg xmlns="http://www.w3.org/2000/svg" width="780" height="300" viewBox="0 0 780 300" font-family="Arial, Helvetica, sans-serif">
  <rect width="780" height="300" fill="#ffffff"/>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1d3557"/></marker></defs>
  <text x="390" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1b1f2a">Two ways to play a sound</text>

  <text x="20" y="70" font-size="15" font-weight="bold" fill="#1d3557">this.sound.play(key, config)</text>
  <text x="20" y="90" font-size="12" fill="#1b1f2a">"fire and forget"</text>
  <rect x="250" y="50" width="130" height="56" rx="10" fill="#a8dadc" stroke="#1d3557" stroke-width="2"/>
  <text x="315" y="75" text-anchor="middle" font-size="13" font-weight="bold" fill="#1b1f2a">Phaser makes</text>
  <text x="315" y="93" text-anchor="middle" font-size="13" fill="#1b1f2a">a sound</text>
  <rect x="415" y="50" width="130" height="56" rx="10" fill="#f4a261" stroke="#1d3557" stroke-width="2"/>
  <text x="480" y="83" text-anchor="middle" font-size="13" font-weight="bold" fill="#1b1f2a">plays it</text>
  <rect x="580" y="50" width="180" height="56" rx="10" fill="#f1faee" stroke="#457b9d" stroke-width="2"/>
  <text x="670" y="75" text-anchor="middle" font-size="13" font-weight="bold" fill="#1b1f2a">"complete":</text>
  <text x="670" y="93" text-anchor="middle" font-size="13" fill="#1b1f2a">destroys it</text>
  <path d="M380 78 L411 78" stroke="#1d3557" stroke-width="2" marker-end="url(#a)"/>
  <path d="M545 78 L576 78" stroke="#1d3557" stroke-width="2" marker-end="url(#a)"/>
  <text x="505" y="130" text-anchor="middle" font-size="12" fill="#e63946">You never get the sound object: you cannot stop it, change it, or know when it ends.</text>

  <line x1="20" y1="150" x2="760" y2="150" stroke="#a8dadc" stroke-width="1"/>

  <text x="20" y="190" font-size="15" font-weight="bold" fill="#1d3557">const s = this.sound.add(key, config)</text>
  <text x="20" y="210" font-size="12" fill="#1b1f2a">"keep it"</text>
  <rect x="300" y="170" width="170" height="56" rx="10" fill="#a8dadc" stroke="#1d3557" stroke-width="2"/>
  <text x="385" y="195" text-anchor="middle" font-size="13" font-weight="bold" fill="#1b1f2a">you get the sound</text>
  <text x="385" y="213" text-anchor="middle" font-size="13" fill="#1b1f2a">object (not playing)</text>
  <rect x="505" y="170" width="255" height="56" rx="10" fill="#f4a261" stroke="#1d3557" stroke-width="2"/>
  <text x="632" y="195" text-anchor="middle" font-size="13" font-weight="bold" fill="#1b1f2a">s.play()  s.pause()  s.stop()</text>
  <text x="632" y="213" text-anchor="middle" font-size="13" fill="#1b1f2a">s.setVolume()  s.once("complete")</text>
  <path d="M470 198 L501 198" stroke="#1d3557" stroke-width="2" marker-end="url(#a)"/>
  <text x="530" y="252" text-anchor="middle" font-size="12" fill="#e63946">It stays in the sound manager - played or not - until you call s.destroy().</text>
  <text x="530" y="272" text-anchor="middle" font-size="12" fill="#1b1f2a">Use it for music, and for any sound you need to control or listen to.</text>
</svg>
