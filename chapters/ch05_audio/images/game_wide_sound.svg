<svg xmlns="http://www.w3.org/2000/svg" width="760" height="330" viewBox="0 0 760 330" font-family="Arial, Helvetica, sans-serif">
  <rect width="760" height="330" fill="#ffffff"/>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1d3557"/></marker></defs>
  <text x="380" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1b1f2a">One sound manager for the whole game</text>

  <rect x="20" y="48" width="720" height="270" rx="12" fill="#f1faee" stroke="#457b9d" stroke-width="2"/>
  <text x="40" y="72" font-size="14" font-weight="bold" fill="#1d3557">the game</text>

  <rect x="40" y="88" width="210" height="100" rx="10" fill="#a8dadc" stroke="#1d3557" stroke-width="2"/>
  <text x="145" y="110" text-anchor="middle" font-size="14" font-weight="bold" fill="#1b1f2a">MenuScene</text>
  <text x="145" y="130" text-anchor="middle" font-size="12" fill="#1b1f2a">its own game objects,</text>
  <text x="145" y="146" text-anchor="middle" font-size="12" fill="#1b1f2a">input, tweens, clock</text>
  <text x="145" y="172" text-anchor="middle" font-size="12" fill="#e63946">shut down on scene.start</text>

  <rect x="275" y="88" width="210" height="100" rx="10" fill="#a8dadc" stroke="#1d3557" stroke-width="2"/>
  <text x="380" y="110" text-anchor="middle" font-size="14" font-weight="bold" fill="#1b1f2a">CreditsScene</text>
  <text x="380" y="130" text-anchor="middle" font-size="12" fill="#1b1f2a">its own game objects,</text>
  <text x="380" y="146" text-anchor="middle" font-size="12" fill="#1b1f2a">input, tweens, clock</text>

  <rect x="510" y="88" width="210" height="100" rx="10" fill="#a8dadc" stroke="#1d3557" stroke-width="2"/>
  <text x="615" y="110" text-anchor="middle" font-size="14" font-weight="bold" fill="#1b1f2a">GameScene</text>
  <text x="615" y="130" text-anchor="middle" font-size="12" fill="#1b1f2a">its own game objects,</text>
  <text x="615" y="146" text-anchor="middle" font-size="12" fill="#1b1f2a">input, tweens, clock</text>

  <path d="M145 188 L300 234" stroke="#1d3557" stroke-width="2" marker-end="url(#a)"/>
  <path d="M380 188 L380 232" stroke="#1d3557" stroke-width="2" marker-end="url(#a)"/>
  <path d="M615 188 L460 234" stroke="#1d3557" stroke-width="2" marker-end="url(#a)"/>
  <text x="195" y="222" text-anchor="middle" font-size="13" fill="#1d3557">this.sound</text>
  <text x="565" y="222" text-anchor="middle" font-size="13" fill="#1d3557">this.sound</text>

  <rect x="200" y="236" width="360" height="70" rx="10" fill="#f4a261" stroke="#1d3557" stroke-width="2"/>
  <text x="380" y="258" text-anchor="middle" font-size="14" font-weight="bold" fill="#1b1f2a">the sound manager</text>
  <text x="380" y="278" text-anchor="middle" font-size="12" fill="#1b1f2a">music_menu (playing)   music_game (paused)   click</text>
  <text x="380" y="295" text-anchor="middle" font-size="12" fill="#1b1f2a">mute, volume, locked</text>
