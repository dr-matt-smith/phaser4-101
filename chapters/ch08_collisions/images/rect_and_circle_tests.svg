<svg xmlns="http://www.w3.org/2000/svg" width="780" height="330" viewBox="0 0 780 330" font-family="Arial, Helvetica, sans-serif">
  <rect width="780" height="330" fill="#ffffff"/>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d3557"/></marker></defs>

  <!-- rectangles -->
  <text x="190" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1b1f2a">RectangleToRectangle</text>
  <rect x="40" y="70" width="170" height="110" fill="#a8dadc" fill-opacity="0.8" stroke="#1d3557" stroke-width="2"/>
  <text x="52" y="92" font-size="15" font-weight="bold" fill="#1d3557">a</text>
  <rect x="150" y="130" width="180" height="100" fill="#f4a261" fill-opacity="0.7" stroke="#1d3557" stroke-width="2"/>
  <text x="316" y="222" text-anchor="end" font-size="15" font-weight="bold" fill="#1d3557">b</text>
  <rect x="150" y="130" width="60" height="50" fill="#e63946" fill-opacity="0.75"/>
  <line x1="150" y1="245" x2="150" y2="58" stroke="#1d3557" stroke-dasharray="4 3"/>
  <line x1="210" y1="245" x2="210" y2="58" stroke="#1d3557" stroke-dasharray="4 3"/>
  <text x="150" y="260" text-anchor="middle" font-size="12" fill="#1b1f2a">b.left</text>
  <text x="212" y="260" text-anchor="middle" font-size="12" fill="#1b1f2a">a.right</text>
  <text x="190" y="290" text-anchor="middle" font-size="13" fill="#1b1f2a">they overlap when a.left &lt; b.right, a.right &gt; b.left,</text>
  <text x="190" y="308" text-anchor="middle" font-size="13" fill="#1b1f2a">a.top &lt; b.bottom and a.bottom &gt; b.top - all four</text>

  <line x1="390" y1="20" x2="390" y2="315" stroke="#a8dadc" stroke-width="2"/>

  <!-- circles -->
  <text x="590" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1b1f2a">CircleToCircle</text>
  <circle cx="520" cy="150" r="80" fill="#a8dadc" fill-opacity="0.8" stroke="#1d3557" stroke-width="2"/>
  <circle cx="660" cy="170" r="70" fill="#f4a261" fill-opacity="0.7" stroke="#1d3557" stroke-width="2"/>
  <circle cx="520" cy="150" r="4" fill="#1d3557"/>
  <circle cx="660" cy="170" r="4" fill="#1d3557"/>
  <line x1="520" y1="150" x2="660" y2="170" stroke="#e63946" stroke-width="3"/>
  <text x="596" y="182" text-anchor="middle" font-size="15" font-weight="bold" fill="#e63946">d</text>
  <line x1="520" y1="150" x2="520" y2="70" stroke="#1d3557" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="528" y="104" font-size="14" fill="#1d3557">r1</text>
  <line x1="660" y1="170" x2="660" y2="240" stroke="#1d3557" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="668" y="214" font-size="14" fill="#1d3557">r2</text>
  <text x="590" y="290" text-anchor="middle" font-size="13" fill="#1b1f2a">they overlap when the distance between the</text>
  <text x="590" y="308" text-anchor="middle" font-size="13" fill="#1b1f2a">centres is less than the radii added: d &lt; r1 + r2</text>
</svg>
