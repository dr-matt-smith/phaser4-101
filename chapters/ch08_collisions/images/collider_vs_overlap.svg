<svg xmlns="http://www.w3.org/2000/svg" width="780" height="290" viewBox="0 0 780 290" font-family="Arial, Helvetica, sans-serif">
  <rect width="780" height="290" fill="#ffffff"/>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1d3557"/></marker></defs>

  <text x="195" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1b1f2a">this.physics.add.collider(a, b)</text>
  <text x="585" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1b1f2a">this.physics.add.overlap(a, b)</text>
  <line x1="390" y1="15" x2="390" y2="280" stroke="#a8dadc" stroke-width="2"/>

  <!-- collider: step 1 overlapping -->
  <text x="100" y="62" text-anchor="middle" font-size="13" fill="#1b1f2a">1. a moves into b</text>
  <rect x="40" y="80" width="60" height="60" fill="#457b9d" fill-opacity="0.85"/>
  <text x="70" y="116" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">a</text>
  <rect x="85" y="80" width="60" height="60" fill="#f4a261" fill-opacity="0.85"/>
  <text x="130" y="116" text-anchor="middle" font-size="16" font-weight="bold" fill="#1b1f2a">b</text>
  <path d="M170 110 L210 110" stroke="#1d3557" stroke-width="2" marker-end="url(#a)"/>
  <!-- step 2 separated -->
  <text x="295" y="62" text-anchor="middle" font-size="13" fill="#1b1f2a">2. Phaser pushes them apart</text>
  <rect x="225" y="80" width="60" height="60" fill="#457b9d" fill-opacity="0.85"/>
  <text x="255" y="116" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">a</text>
  <rect x="295" y="80" width="60" height="60" fill="#f4a261" fill-opacity="0.85"/>
  <text x="325" y="116" text-anchor="middle" font-size="16" font-weight="bold" fill="#1b1f2a">b</text>
  <text x="195" y="180" text-anchor="middle" font-size="14" fill="#1b1f2a">separates them, changes their velocities</text>
  <text x="195" y="200" text-anchor="middle" font-size="14" fill="#1b1f2a">(bounce), THEN calls your callback</text>
  <text x="195" y="235" text-anchor="middle" font-size="13" font-weight="bold" fill="#2a9d8f">walls, crates, bricks, the paddle</text>

  <!-- overlap -->
  <text x="585" y="62" text-anchor="middle" font-size="13" fill="#1b1f2a">a moves into b - and nothing is pushed</text>
  <rect x="530" y="80" width="60" height="60" fill="#457b9d" fill-opacity="0.85"/>
  <text x="560" y="116" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">a</text>
  <rect x="575" y="80" width="60" height="60" fill="#f4a261" fill-opacity="0.85"/>
  <text x="620" y="116" text-anchor="middle" font-size="16" font-weight="bold" fill="#1b1f2a">b</text>
  <text x="585" y="180" text-anchor="middle" font-size="14" fill="#1b1f2a">only calls your callback, every frame</text>
  <text x="585" y="200" text-anchor="middle" font-size="14" fill="#1b1f2a">that they still touch</text>
  <text x="585" y="235" text-anchor="middle" font-size="13" font-weight="bold" fill="#2a9d8f">pickups, hazards, trigger areas</text>
</svg>
