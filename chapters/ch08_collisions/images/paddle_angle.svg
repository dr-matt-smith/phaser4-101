<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300" font-family="Arial, Helvetica, sans-serif">
  <rect width="720" height="300" fill="#ffffff"/>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#e63946"/></marker></defs>
  <text x="360" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1b1f2a">Where the ball lands decides where it goes</text>
  <rect x="160" y="220" width="400" height="30" rx="12" fill="#f1faee" stroke="#1d3557" stroke-width="2"/>
  <line x1="360" y1="215" x2="360" y2="255" stroke="#1d3557" stroke-dasharray="4 3"/>
  <text x="160" y="275" text-anchor="middle" font-size="14" fill="#1b1f2a">-1</text>
  <text x="360" y="275" text-anchor="middle" font-size="14" fill="#1b1f2a">0</text>
  <text x="560" y="275" text-anchor="middle" font-size="14" fill="#1b1f2a">1</text>
  <text x="360" y="293" text-anchor="middle" font-size="12" fill="#1b1f2a">where = (ball.x - paddle.x) / half the paddle's width</text>
  <!-- rays -->
  <circle cx="175" cy="208" r="10" fill="#457b9d"/>
  <path d="M175 208 L 88 158" stroke="#e63946" stroke-width="3" marker-end="url(#a)"/>
  <text x="60" y="140" font-size="13" fill="#1b1f2a">60° left</text>
  <circle cx="360" cy="208" r="10" fill="#457b9d"/>
  <path d="M360 208 L 360 80" stroke="#e63946" stroke-width="3" marker-end="url(#a)"/>
  <text x="368" y="80" font-size="13" fill="#1b1f2a">straight up</text>
  <circle cx="460" cy="208" r="10" fill="#457b9d"/>
  <path d="M460 208 L 510 95" stroke="#e63946" stroke-width="3" marker-end="url(#a)"/>
  <text x="516" y="95" font-size="13" fill="#1b1f2a">30° right</text>
  <circle cx="545" cy="208" r="10" fill="#457b9d"/>
  <path d="M545 208 L 632 158" stroke="#e63946" stroke-width="3" marker-end="url(#a)"/>
  <text x="638" y="155" font-size="13" fill="#1b1f2a">60° right</text>
</svg>
