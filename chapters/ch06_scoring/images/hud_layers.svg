<svg xmlns="http://www.w3.org/2000/svg" width="760" height="300" viewBox="0 0 760 300" font-family="Arial, Helvetica, sans-serif">
  <rect width="760" height="300" fill="#ffffff"/>
  <text x="380" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1b1f2a">Two scenes running at once, one drawn on top of the other</text>

  <!-- the game scene, at the back -->
  <rect x="40" y="90" width="280" height="180" fill="#1d3557" stroke="#1b1f2a" stroke-width="2"/>
  <circle cx="110" cy="200" r="16" fill="#f4a261" stroke="#1b1f2a" stroke-width="3"/>
  <circle cx="230" cy="160" r="16" fill="#f4a261" stroke="#1b1f2a" stroke-width="3"/>
  <circle cx="270" cy="240" r="16" fill="#f4a261" stroke="#1b1f2a" stroke-width="3"/>
  <text x="60" y="262" font-size="13" font-weight="bold" fill="#f1faee">GameScene</text>

  <!-- the HUD, in front: only a bar is drawn, the rest is see-through -->
  <rect x="100" y="55" width="280" height="180" fill="none" stroke="#457b9d" stroke-width="2" stroke-dasharray="6 4"/>
  <rect x="100" y="55" width="280" height="30" fill="#1b1f2a" fill-opacity="0.85"/>
  <text x="110" y="75" font-size="13" font-weight="bold" fill="#ffffff">SCORE 000140</text>
  <text x="240" y="75" font-size="13" font-weight="bold" fill="#ffffff">LEVEL 1</text>
  <text x="325" y="76" font-size="15" fill="#e63946">&#9829;&#9829;&#9829;</text>
  <text x="380" y="48" text-anchor="end" font-size="13" font-weight="bold" fill="#457b9d">HudScene (see-through, except its bar)</text>

  <text x="420" y="80" font-size="14" font-weight="bold" fill="#1d3557">main.ts</text>
  <text x="420" y="102" font-size="12" font-family="Courier New, monospace" fill="#1b1f2a">scene: [TitleScene, GameScene,</text>
  <text x="420" y="118" font-size="12" font-family="Courier New, monospace" fill="#1b1f2a" xml:space="preserve">        HudScene, GameOverScene]</text>
  <text x="420" y="140" font-size="12" fill="#1b1f2a">Later in the list = drawn later = on top.</text>

  <text x="420" y="178" font-size="14" font-weight="bold" fill="#1d3557">GameScene</text>
  <text x="420" y="200" font-size="12" font-family="Courier New, monospace" fill="#1b1f2a">this.scene.launch(HUD_SCENE, data)</text>
  <text x="420" y="216" font-size="12" fill="#1b1f2a">starts the HUD beside it, on the next frame</text>
  <text x="420" y="240" font-size="12" font-family="Courier New, monospace" fill="#1b1f2a">this.scene.stop(HUD_SCENE)</text>
  <text x="420" y="256" font-size="12" fill="#1b1f2a">takes it away again when the game ends</text>
</svg>
