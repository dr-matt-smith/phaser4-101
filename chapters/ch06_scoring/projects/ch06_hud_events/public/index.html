<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles.css" />
    <title>HUD Events</title>
  </head>
  <body>
    <main>
      <!-- Phaser creates the game's <canvas> inside this div -->
      <div id="game"></div>

      <section class="controls">
        <h3>Controls</h3>
        <div class="control-grid">
          <kbd>Mouse</kbd>
          <span>Click the coin, gem or star</span>
          <kbd>1 2 3</kbd>
          <span>Add a coin, a gem, a star</span>
          <kbd>R</kbd>
          <span>Restart the game scene</span>
          <kbd>H</kbd>
          <span>Restart the HUD</span>
        </div>
      </section>
    </main>
    <script src="game.js"></script>
  </body>
</html>
