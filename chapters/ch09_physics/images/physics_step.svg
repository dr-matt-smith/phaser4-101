<svg xmlns="http://www.w3.org/2000/svg" width="720" height="470" viewBox="0 0 720 470" font-family="Arial, Helvetica, sans-serif">
  <rect width="720" height="470" fill="#ffffff"/>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1d3557"/></marker></defs>
  <text x="360" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#1b1f2a">What Arcade Physics does to each body, every step</text>
  <text x="360" y="52" text-anchor="middle" font-size="13" fill="#1b1f2a">dt = the length of one step in seconds (1/60 = 0.0167)</text>

  <rect x="150" y="70" width="420" height="52" rx="10" fill="#a8dadc" stroke="#1d3557" stroke-width="2"/>
  <text x="360" y="92" text-anchor="middle" font-size="15" font-weight="bold" fill="#1b1f2a">1. velocity += (gravity + acceleration) x dt</text>
  <text x="360" y="111" text-anchor="middle" font-size="12" fill="#1b1f2a">setGravityY, world gravity, setAcceleration</text>

  <rect x="150" y="142" width="420" height="52" rx="10" fill="#a8dadc" stroke="#1d3557" stroke-width="2"/>
  <text x="360" y="164" text-anchor="middle" font-size="15" font-weight="bold" fill="#1b1f2a">2. no acceleration on this axis? apply drag</text>
  <text x="360" y="183" text-anchor="middle" font-size="12" fill="#1b1f2a">setDrag - linear, or with setDamping(true) a fraction</text>

  <rect x="150" y="214" width="420" height="52" rx="10" fill="#a8dadc" stroke="#1d3557" stroke-width="2"/>
  <text x="360" y="236" text-anchor="middle" font-size="15" font-weight="bold" fill="#1b1f2a">3. limit the velocity</text>
  <text x="360" y="255" text-anchor="middle" font-size="12" fill="#1b1f2a">setMaxVelocity (each axis), setMaxSpeed (any direction)</text>

  <rect x="150" y="286" width="420" height="52" rx="10" fill="#a8dadc" stroke="#1d3557" stroke-width="2"/>
  <text x="360" y="308" text-anchor="middle" font-size="15" font-weight="bold" fill="#1b1f2a">4. position += velocity x dt</text>
  <text x="360" y="327" text-anchor="middle" font-size="12" fill="#1b1f2a">and angle += angular velocity x dt (the same 1-3 for turning)</text>

  <rect x="150" y="358" width="420" height="52" rx="10" fill="#f4a261" stroke="#1d3557" stroke-width="2"/>
  <text x="360" y="380" text-anchor="middle" font-size="15" font-weight="bold" fill="#1b1f2a">5. world bounds, then colliders and overlaps</text>
  <text x="360" y="399" text-anchor="middle" font-size="12" fill="#1b1f2a">push bodies apart, apply bounce, set blocked / touching, call callbacks</text>

  <path d="M360 122 L360 138" stroke="#1d3557" stroke-width="2.5" marker-end="url(#a)"/>
  <path d="M360 194 L360 210" stroke="#1d3557" stroke-width="2.5" marker-end="url(#a)"/>
  <path d="M360 266 L360 282" stroke="#1d3557" stroke-width="2.5" marker-end="url(#a)"/>
  <path d="M360 338 L360 354" stroke="#1d3557" stroke-width="2.5" marker-end="url(#a)"/>

  <text x="360" y="440" text-anchor="middle" font-size="14" fill="#e63946">You set the numbers. Phaser does this arithmetic - with dt - for every body.</text>
  <text x="360" y="460" text-anchor="middle" font-size="14" fill="#e63946">Then the game object is moved to where its body ended up.</text>
</svg>
