<svg xmlns="http://www.w3.org/2000/svg" width="760" height="360" viewBox="0 0 760 360" font-family="Arial, Helvetica, sans-serif">
  <rect width="760" height="360" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1d3557"/></marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#e63946"/></marker>
  </defs>
  <text x="380" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#1b1f2a">Which way is angle 0?</text>

  <!-- left: Phaser's angles -->
  <text x="190" y="62" text-anchor="middle" font-size="15" font-weight="bold" fill="#1d3557">Phaser's angles (and the maths)</text>
  <circle cx="190" cy="195" r="95" fill="#f1faee" stroke="#a8dadc" stroke-width="2"/>
  <path d="M190 195 L300 195" stroke="#1d3557" stroke-width="2.5" marker-end="url(#a)"/>
  <path d="M190 195 L190 305" stroke="#1d3557" stroke-width="2.5" marker-end="url(#a)"/>
  <path d="M190 195 L80 195" stroke="#1d3557" stroke-width="2.5" marker-end="url(#a)"/>
  <path d="M190 195 L190 85" stroke="#1d3557" stroke-width="2.5" marker-end="url(#a)"/>
  <text x="306" y="190" font-size="13" fill="#1b1f2a">0 (right)</text>
  <text x="200" y="322" font-size="13" fill="#1b1f2a">90° = PI/2 (down)</text>
  <text x="18" y="190" font-size="13" fill="#1b1f2a">180° = PI</text>
  <text x="200" y="82" font-size="13" fill="#1b1f2a">-90° = -PI/2 (up)</text>
  <text x="190" y="345" text-anchor="middle" font-size="13" fill="#1b1f2a">y goes DOWN the screen, so angles go clockwise</text>

  <!-- right: the ship -->
  <text x="575" y="62" text-anchor="middle" font-size="15" font-weight="bold" fill="#1d3557">The ship's picture points up</text>
  <g transform="translate(575 190)">
    <polygon points="0,-40 30,28 0,14 -30,28" fill="#457b9d" stroke="#1d3557" stroke-width="2"/>
    <rect x="-7" y="18" width="14" height="14" fill="#f4a261"/>
  </g>
  <path d="M575 145 L575 90" stroke="#e63946" stroke-width="2.5" marker-end="url(#r)"/>
  <text x="588" y="102" font-size="13" fill="#e63946">the way it flies</text>
  <text x="575" y="250" text-anchor="middle" font-size="14" fill="#1b1f2a">drawn like this, its rotation is 0</text>
  <text x="575" y="270" text-anchor="middle" font-size="14" fill="#1b1f2a">- but it faces -PI/2 (up)</text>
  <rect x="440" y="290" width="270" height="36" rx="8" fill="#a8dadc" stroke="#1d3557"/>
  <text x="575" y="313" text-anchor="middle" font-size="14" font-weight="bold" fill="#1b1f2a">facing = rotation - Math.PI / 2</text>
</svg>
