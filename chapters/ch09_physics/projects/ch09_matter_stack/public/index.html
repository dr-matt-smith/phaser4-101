<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles.css" />
    <title>Matter Stack</title>
  </head>
  <body>
    <main>
      <!-- Phaser creates the game's <canvas> inside this div -->
      <div id="game"></div>

      <section class="controls">
        <h3>Controls</h3>
        <div class="control-grid">
          <kbd>Mouse</kbd>
          <span>Drag anything</span>
          <kbd>Space</kbd>
          <span>Fire a cannonball at the pointer</span>
          <kbd>1</kbd>
          <span>Drop a crate at the pointer</span>
          <kbd>2</kbd>
          <span>Drop a ball</span>
          <kbd>3</kbd>
          <span>Drop a hexagon</span>
          <kbd>4</kbd>
          <span>Drop a triangle</span>
          <kbd>V</kbd>
          <span>Show the physics bodies</span>
          <kbd>R</kbd>
          <span>Build it all again</span>
        </div>
      </section>
    </main>
    <script src="game.js"></script>
  </body>
</html>
