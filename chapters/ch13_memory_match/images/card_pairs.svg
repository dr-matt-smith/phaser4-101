<svg xmlns="http://www.w3.org/2000/svg" width="760" height="250" viewBox="0 0 760 250" font-family="Arial, Helvetica, sans-serif">
<rect width="760" height="250" fill="#ffffff"/>
<text x="380" y="26" text-anchor="middle" font-size="18" font-weight="bold" fill="#1b1f2a">Same picture, or same meaning? A TileFace has both</text>
<rect x="40" y="60" width="64" height="90" rx="7" fill="#fffdf5" stroke="#8d99ae" stroke-width="2"/>
<text x="48" y="80" font-size="15" font-weight="bold" fill="#e63946">7</text>
<text x="72" y="122" text-anchor="middle" font-size="34" fill="#e63946">♥</text>
<text x="72" y="168" text-anchor="middle" font-size="11.5" font-family="Courier New, monospace" fill="#1d3557">frame: 32</text>
<text x="72" y="183" text-anchor="middle" font-size="11.5" font-family="Courier New, monospace" fill="#1d3557">"7 red"</text>
<rect x="130" y="60" width="64" height="90" rx="7" fill="#fffdf5" stroke="#8d99ae" stroke-width="2"/>
<text x="138" y="80" font-size="15" font-weight="bold" fill="#e63946">7</text>
<text x="162" y="122" text-anchor="middle" font-size="34" fill="#e63946">♦</text>
<text x="162" y="168" text-anchor="middle" font-size="11.5" font-family="Courier New, monospace" fill="#1d3557">frame: 19</text>
<text x="162" y="183" text-anchor="middle" font-size="11.5" font-family="Courier New, monospace" fill="#1d3557">"7 red"</text>
<text x="117" y="220" text-anchor="middle" font-size="15" font-weight="bold" fill="#2a9d8f">match</text>
<rect x="300" y="60" width="64" height="90" rx="7" fill="#fffdf5" stroke="#8d99ae" stroke-width="2"/>
<text x="308" y="80" font-size="15" font-weight="bold" fill="#e63946">7</text>
<text x="332" y="122" text-anchor="middle" font-size="34" fill="#e63946">♥</text>
<text x="332" y="168" text-anchor="middle" font-size="11.5" font-family="Courier New, monospace" fill="#1d3557">frame: 32</text>
<text x="332" y="183" text-anchor="middle" font-size="11.5" font-family="Courier New, monospace" fill="#1d3557">"7 red"</text>
<rect x="390" y="60" width="64" height="90" rx="7" fill="#fffdf5" stroke="#8d99ae" stroke-width="2"/>
<text x="398" y="80" font-size="15" font-weight="bold" fill="#1b1f2a">7</text>
<text x="422" y="122" text-anchor="middle" font-size="34" fill="#1b1f2a">♠</text>
<text x="422" y="168" text-anchor="middle" font-size="11.5" font-family="Courier New, monospace" fill="#1d3557">frame: 45</text>
<text x="422" y="183" text-anchor="middle" font-size="11.5" font-family="Courier New, monospace" fill="#1d3557">"7 black"</text>
<text x="377" y="220" text-anchor="middle" font-size="15" font-weight="bold" fill="#e63946">no match</text>
<text x="520" y="70" font-size="14" font-weight="bold" font-family="Courier New, monospace" fill="#1d3557">frame</text>
<text x="520" y="87" font-size="13" fill="#1b1f2a">what the tile shows -</text>
<text x="520" y="104" font-size="13" fill="#1b1f2a">a different card for each</text>
<text x="520" y="121" font-size="13" fill="#1b1f2a"></text>
<text x="520" y="138" font-size="14" font-weight="bold" font-family="Courier New, monospace" fill="#1d3557">matchKey</text>
<text x="520" y="155" font-size="13" fill="#1b1f2a">what the tile means -</text>
<text x="520" y="172" font-size="13" fill="#1b1f2a">tiles match when these</text>
<text x="520" y="189" font-size="13" fill="#1b1f2a">are the same</text>
</svg>