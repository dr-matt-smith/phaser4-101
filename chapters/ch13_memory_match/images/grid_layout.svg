<text x="169.9" y="214.5" text-anchor="middle" font-size="8" fill="#1b1f2a">row 1, col 1</text>
<rect x="199.6" y="174.5" width="45.0" height="45.0" rx="5" fill="#a8dadc" stroke="#1d3557" stroke-width="1.5"/>
<text x="222.1" y="191.5" text-anchor="middle" font-size="15" font-weight="bold" fill="#1d3557">6</text>
<text x="222.1" y="214.5" text-anchor="middle" font-size="8" fill="#1b1f2a">row 1, col 2</text>
<rect x="251.8" y="174.5" width="45.0" height="45.0" rx="5" fill="#a8dadc" stroke="#1d3557" stroke-width="1.5"/>
<text x="274.3" y="191.5" text-anchor="middle" font-size="15" font-weight="bold" fill="#1d3557">7</text>
<text x="274.3" y="214.5" text-anchor="middle" font-size="8" fill="#1b1f2a">row 1, col 3</text>
<rect x="95.2" y="226.7" width="45.0" height="45.0" rx="5" fill="#a8dadc" stroke="#1d3557" stroke-width="1.5"/>
<text x="117.7" y="243.7" text-anchor="middle" font-size="15" font-weight="bold" fill="#1d3557">8</text>
<text x="117.7" y="266.7" text-anchor="middle" font-size="8" fill="#1b1f2a">row 2, col 0</text>
<rect x="147.4" y="226.7" width="45.0" height="45.0" rx="5" fill="#a8dadc" stroke="#1d3557" stroke-width="1.5"/>
