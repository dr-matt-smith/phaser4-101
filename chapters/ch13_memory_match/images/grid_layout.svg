<path d="M95.2 110.3 L296.8 110.3" stroke="#1d3557" stroke-width="1.5" marker-start="url(#a)" marker-end="url(#a)"/>
<text x="196.0" y="104.3" text-anchor="middle" font-size="12" fill="#1d3557">gridWidth</text>
<path d="M16.0 289.7 L95.2 289.7" stroke="#e63946" stroke-width="1.5" marker-start="url(#r)" marker-end="url(#r)"/>
<text x="55.6" y="304.7" text-anchor="middle" font-size="11" fill="#e63946">margin</text>
<path d="M296.8 289.7 L376.0 289.7" stroke="#e63946" stroke-width="1.5" marker-start="url(#r)" marker-end="url(#r)"/>
<text x="336.4" y="304.7" text-anchor="middle" font-size="11" fill="#e63946">margin</text>
<path d="M143.8 171.3 L143.8 120.3" stroke="#2a9d8f" stroke-width="0"/>
<circle cx="117.7" cy="144.8" r="4" fill="#e63946"/>
<path d="M114.7 141.8 L56 86" stroke="#e63946" stroke-width="1.2"/>
<text x="24" y="80" font-size="11" fill="#e63946">(left, top): the CENTRE of tile 0</text>
<text x="143.8" y="321.7" text-anchor="middle" font-size="11" fill="#2a9d8f">GAP</text>
<path d="M143.8 309.7 L143.8 249.2" stroke="#2a9d8f" stroke-width="1.2" stroke-dasharray="3 2"/>
<text x="398" y="80" font-size="15" font-weight="bold" fill="#1d3557">The sums in layOutGrid()</text>
<text x="398" y="108" font-size="11.5" font-family="Courier New, monospace" font-weight="bold" fill="#1b1f2a" xml:space="preserve">gridWidth = COLS * TILE_SIZE + (COLS - 1) * GAP</text>
<text x="406" y="126" font-size="11.5" fill="#457b9d">four tiles across, but only three gaps between them</text>
<text x="398" y="150" font-size="11.5" font-family="Courier New, monospace" font-weight="bold" fill="#1b1f2a" xml:space="preserve">left = (800 - gridWidth) / 2 + TILE_SIZE / 2</text>
<text x="406" y="168" font-size="11.5" fill="#457b9d">two equal margins, so the grid is centred - and</text>
<text x="406" y="184" font-size="11.5" fill="#457b9d">+ TILE_SIZE / 2, because a tile's origin is its centre</text>
<text x="398" y="208" font-size="11.5" font-family="Courier New, monospace" font-weight="bold" fill="#1b1f2a" xml:space="preserve">x = left + col * (TILE_SIZE + GAP)</text>
<text x="398" y="226" font-size="11.5" font-family="Courier New, monospace" font-weight="bold" fill="#1b1f2a" xml:space="preserve">y = top  + row * (TILE_SIZE + GAP)</text>
<text x="406" y="244" font-size="11.5" fill="#457b9d">each step across or down is one tile and one gap</text>
<text x="398" y="268" font-size="11.5" font-family="Courier New, monospace" font-weight="bold" fill="#1b1f2a" xml:space="preserve">face = faces[row * COLS + col]</text>
<text x="406" y="286" font-size="11.5" fill="#457b9d">the shuffled faces are dealt out row by row: the</text>
<text x="406" y="302" font-size="11.5" fill="#457b9d">number on each tile is its index in the array</text>
</svg>