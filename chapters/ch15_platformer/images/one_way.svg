<svg xmlns="http://www.w3.org/2000/svg" width="800" height="380" viewBox="0 0 800 380" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1b1f2a"/>
    </marker>
  </defs>
  <rect width="800" height="380" fill="#ffffff"/>
  <text x="400" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#1b1f2a">Solid from above only</text>

  <!-- platform -->
  <text x="200" y="66" text-anchor="middle" font-size="17" font-weight="bold" fill="#1d3557">A one-way platform</text>
  <rect x="100" y="150" width="200" height="30" fill="#8d5a2b"/>
  <rect x="100" y="150" width="200" height="8" fill="#52b788"/>
  <line x1="100" y1="150" x2="300" y2="150" stroke="#2a9d8f" stroke-width="5"/>
  <line x1="100" y1="180" x2="300" y2="180" stroke="#e63946" stroke-width="2" stroke-dasharray="6 4"/>
  <line x1="100" y1="150" x2="100" y2="180" stroke="#e63946" stroke-width="2" stroke-dasharray="6 4"/>
  <line x1="300" y1="150" x2="300" y2="180" stroke="#e63946" stroke-width="2" stroke-dasharray="6 4"/>
  <path d="M 150 290 Q 170 150 230 110 Q 260 100 270 146" fill="none" stroke="#1d3557" stroke-width="2.5" marker-end="url(#a)"/>
  <text x="310" y="146" font-size="13" fill="#2a9d8f">top: collides</text>
  <text x="182" y="202" font-size="13" fill="#e63946">sides, bottom: pass through</text>
  <text x="60" y="320" font-size="14" font-family="Courier New, monospace" fill="#1d3557">body.checkCollision.down = false;</text>
  <text x="60" y="338" font-size="14" font-family="Courier New, monospace" fill="#1d3557">body.checkCollision.left = false;</text>
  <text x="60" y="356" font-size="14" font-family="Courier New, monospace" fill="#1d3557">body.checkCollision.right = false;</text>

  <line x1="420" y1="60" x2="420" y2="360" stroke="#a8dadc" stroke-width="2"/>

  <!-- ladder -->
  <text x="610" y="66" text-anchor="middle" font-size="17" font-weight="bold" fill="#1d3557">The top of a ladder</text>
  <rect x="460" y="120" width="100" height="30" fill="#b5523b"/>
  <rect x="592" y="120" width="140" height="30" fill="#b5523b"/>
  <g stroke="#8d5a2b" stroke-width="4">
    <line x1="566" y1="120" x2="566" y2="290"/>
    <line x1="586" y1="120" x2="586" y2="290"/>
  </g>
  <g stroke="#b07d50" stroke-width="3">
    <line x1="566" y1="130" x2="586" y2="130"/><line x1="566" y1="160" x2="586" y2="160"/>
    <line x1="566" y1="190" x2="586" y2="190"/><line x1="566" y1="220" x2="586" y2="220"/>
    <line x1="566" y1="250" x2="586" y2="250"/><line x1="566" y1="280" x2="586" y2="280"/>
  </g>
  <line x1="560" y1="120" x2="592" y2="120" stroke="#2a9d8f" stroke-width="5"/>
  <line x1="440" y1="290" x2="780" y2="290" stroke="#2a9d8f" stroke-width="4"/>
  <line x1="560" y1="102" x2="572" y2="116" stroke="#1b1f2a" stroke-width="1.5"/>
  <text x="444" y="98" font-size="13" fill="#1b1f2a">tile.setCollision(false, false, true, false)</text>
  <text x="440" y="320" font-size="14" fill="#1b1f2a">Stand on it, walk across it - but while the hero is</text>
  <text x="440" y="338" font-size="14" fill="#1b1f2a">climbing, the collider's process callback says "no":</text>
  <text x="440" y="358" font-size="14" font-family="Courier New, monospace" fill="#1d3557">() =&gt; !this.hero.isClimbing()</text>
</svg>
