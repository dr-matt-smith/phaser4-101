<svg xmlns="http://www.w3.org/2000/svg" width="780" height="400" viewBox="0 0 780 400" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1b1f2a"/>
    </marker>
  </defs>
  <rect width="780" height="400" fill="#ffffff"/>
  <text x="390" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#1b1f2a">The hero's states - one animation each</text>

  <g font-size="18" font-weight="bold" text-anchor="middle">
    <rect x="60" y="80" width="140" height="56" rx="10" fill="#a8dadc" stroke="#1d3557" stroke-width="2"/>
    <text x="130" y="114" fill="#1b1f2a">idle</text>
    <rect x="320" y="80" width="140" height="56" rx="10" fill="#a8dadc" stroke="#1d3557" stroke-width="2"/>
    <text x="390" y="114" fill="#1b1f2a">run</text>
    <rect x="60" y="250" width="140" height="56" rx="10" fill="#f1faee" stroke="#1d3557" stroke-width="2"/>
    <text x="130" y="284" fill="#1b1f2a">jump</text>
    <rect x="320" y="250" width="140" height="56" rx="10" fill="#f1faee" stroke="#1d3557" stroke-width="2"/>
    <text x="390" y="284" fill="#1b1f2a">fall</text>
    <rect x="580" y="80" width="140" height="56" rx="10" fill="#f4a261" stroke="#1d3557" stroke-width="2"/>
    <text x="650" y="114" fill="#1b1f2a">climb</text>
    <rect x="580" y="250" width="140" height="56" rx="10" fill="#e63946" stroke="#1d3557" stroke-width="2"/>
    <text x="650" y="284" fill="#ffffff">hurt</text>
  </g>

  <g stroke="#1b1f2a" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <path d="M 200 100 L 318 100"/>
    <path d="M 320 118 L 202 118"/>
    <path d="M 120 138 L 120 248"/>
    <path d="M 200 278 L 318 278"/>
    <path d="M 370 250 L 150 138"/>
    <path d="M 400 138 L 400 248"/>
    <path d="M 460 100 L 578 100"/>
    <path d="M 580 118 L 462 118"/>
  </g>
  <g font-size="13" fill="#1b1f2a">
    <text x="259" y="93" text-anchor="middle">speed &gt; 10</text>
    <text x="259" y="134" text-anchor="middle">speed &#8776; 0</text>
    <text x="30" y="200">jumped</text>
    <text x="30" y="216">(going up)</text>
    <text x="259" y="296" text-anchor="middle">top of the arc</text>
    <text x="232" y="186">landed</text>
    <text x="408" y="200">walked off</text>
    <text x="408" y="216">an edge</text>
    <text x="519" y="93" text-anchor="middle">UP at a ladder</text>
    <text x="519" y="134" text-anchor="middle">off the top / bottom</text>
  </g>
  <text x="650" y="200" text-anchor="middle" font-size="13" fill="#1b1f2a">from ANY state:</text>
  <text x="650" y="216" text-anchor="middle" font-size="13" fill="#1b1f2a">spikes, lava, an enemy</text>
  <line x1="650" y1="224" x2="650" y2="246" stroke="#e63946" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="390" y="350" text-anchor="middle" font-size="14" fill="#1b1f2a">Blue: on the ground (body.blocked.down). Cream: in the air. Orange: advanced version only.</text>
  <text x="390" y="372" text-anchor="middle" font-size="14" fill="#1b1f2a">The simple version works the state out afresh every frame; the others remember it in heroState.</text>
</svg>
