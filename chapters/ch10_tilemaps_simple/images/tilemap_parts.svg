<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="760" height="330" viewBox="0 0 760 330" font-family="Arial, Helvetica, sans-serif">
  <rect width="760" height="330" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1d3557"/></marker>
    <marker id="s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#e63946"/></marker>
    <image id="ts" width="128" height="32" style="image-rendering:pixelated" href="data:image/png;base64," xlink:href="data:image/png;base64,"/>
  </defs>
  <text x="380" y="30" text-anchor="middle" font-size="18" fill="#1b1f2a" font-weight="bold">Three objects make a tilemap</text>
  <rect x="30" y="60" width="200" height="150" rx="12" fill="#a8dadc" stroke="#1d3557" stroke-width="2.5"/>
  <text x="130" y="92" text-anchor="middle" font-size="18" fill="#1d3557" font-weight="bold">Tilemap</text>
  <text x="130" y="114" text-anchor="middle" font-size="12" fill="#e63946">the DATA</text>
  <text x="130" y="142" text-anchor="middle" font-size="13" fill="#1b1f2a">a grid of Tile objects:</text>
  <text x="130" y="160" text-anchor="middle" font-size="13" fill="#1b1f2a">index, column, row</text>
  <text x="130" y="178" text-anchor="middle" font-size="13" fill="#1b1f2a">+ the tile size</text>
  <text x="130" y="240" text-anchor="middle" font-size="11.5" fill="#2a9d8f" font-family="Menlo, Consolas, monospace">this.make.tilemap({ data, ... })</text>
  <rect x="280" y="60" width="200" height="150" rx="12" fill="#f1faee" stroke="#457b9d" stroke-width="2.5"/>
  <text x="380" y="92" text-anchor="middle" font-size="18" fill="#1d3557" font-weight="bold">Tileset</text>
  <text x="380" y="114" text-anchor="middle" font-size="12" fill="#e63946">the PICTURE</text>
  <text x="380" y="142" text-anchor="middle" font-size="13" fill="#1b1f2a">which loaded image,</text>
  <text x="380" y="160" text-anchor="middle" font-size="13" fill="#1b1f2a">and how to cut it</text>
  <text x="380" y="178" text-anchor="middle" font-size="13" fill="#1b1f2a">into tiles</text>
  <text x="380" y="240" text-anchor="middle" font-size="11.5" fill="#2a9d8f" font-family="Menlo, Consolas, monospace">map.addTilesetImage(key)</text>
  <rect x="530" y="60" width="200" height="150" rx="12" fill="#fff3e6" stroke="#f4a261" stroke-width="2.5"/>
  <text x="630" y="92" text-anchor="middle" font-size="18" fill="#1d3557" font-weight="bold">TilemapLayer</text>
  <text x="630" y="114" text-anchor="middle" font-size="12" fill="#e63946">the GAME OBJECT</text>
  <text x="630" y="142" text-anchor="middle" font-size="13" fill="#1b1f2a">draws the tiles;</text>
  <text x="630" y="160" text-anchor="middle" font-size="13" fill="#1b1f2a">collides; put, remove</text>
  <text x="630" y="178" text-anchor="middle" font-size="13" fill="#1b1f2a">and find tiles</text>
  <text x="630" y="240" text-anchor="middle" font-size="11.5" fill="#2a9d8f" font-family="Menlo, Consolas, monospace">map.createLayer(0, tileset, 0, 0)</text>
  <path d="M230 135 L276 135" stroke="#1d3557" stroke-width="2.5" marker-end="url(#a)"/>
  <path d="M480 135 L526 135" stroke="#1d3557" stroke-width="2.5" marker-end="url(#a)"/>
  <text x="380" y="285" text-anchor="middle" font-size="13" fill="#1b1f2a">The Tilemap is not drawn - only its layers are. A map can have several layers</text>
  <text x="380" y="305" text-anchor="middle" font-size="13" fill="#1b1f2a">(a floor, and walls on top), each drawn with a tileset</text>
</svg>
