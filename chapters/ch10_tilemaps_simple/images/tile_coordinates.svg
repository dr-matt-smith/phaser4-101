  <text x="530" y="110" text-anchor="start" font-size="13" fill="#e63946" font-weight="bold">a point in the world:  (150, 80)</text>
  <text x="530" y="132" text-anchor="start" font-size="12.5" fill="#1b1f2a" font-family="Menlo, Consolas, monospace">worldToTileXY(150, 80)</text>
  <text x="530" y="150" text-anchor="start" font-size="12.5" fill="#1b1f2a" font-family="Menlo, Consolas, monospace">  -&gt; column 4, row 2</text>
  <text x="530" y="168" text-anchor="start" font-size="12" fill="#1b1f2a">(150 / 32 = 4.7, 80 / 32 = 2.5,</text>
