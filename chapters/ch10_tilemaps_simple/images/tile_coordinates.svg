  <text x="530" y="262" text-anchor="start" font-size="12.5" fill="#1b1f2a" font-family="Menlo, Consolas, monospace">  -&gt; (128, 64)</text>
  <text x="530" y="284" text-anchor="start" font-size="12" fill="#1b1f2a">add half a tile (16) for</text>
  <text x="530" y="300" text-anchor="start" font-size="12" fill="#1b1f2a">its centre: (144, 80)</text>
