  <text x="430" y="110" text-anchor="start" font-size="13" fill="#1b1f2a">each tile's INDEX is its place in the</text>
  <text x="430" y="128" text-anchor="start" font-size="13" fill="#1b1f2a">picture, counting from 0 - left to right,</text>
  <text x="430" y="146" text-anchor="start" font-size="13" fill="#1b1f2a">then row by row in a taller tileset</text>
  <text x="430" y="172" text-anchor="start" font-size="13" fill="#e63946">-1 means "no tile": nothing is drawn</text>
  <text x="40" y="235" text-anchor="start" font-size="13" fill="#1d3557" font-family="Menlo, Consolas, monospace">const LEVEL: number[][] = [</text>
