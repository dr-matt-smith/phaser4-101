  <text x="56" y="346" text-anchor="start" font-size="14" fill="#1b1f2a" font-family="Menlo, Consolas, monospace">[2, 2, 2, 2, 2, 2],</text>
  <text x="40" y="368" text-anchor="start" font-size="13" fill="#1d3557" font-family="Menlo, Consolas, monospace">];</text>
