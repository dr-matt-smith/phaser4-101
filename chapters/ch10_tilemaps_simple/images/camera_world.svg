<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="760" height="420" viewBox="0 0 760 420" font-family="Arial, Helvetica, sans-serif">
  <rect width="760" height="420" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1d3557"/></marker>
    <marker id="s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#e63946"/></marker>
    <image id="ts" width="128" height="32" style="image-rendering:pixelated" href="data:image/png;base64," xlink:href="data:image/png;base64,"/>
  </defs>
  <text x="380" y="30" text-anchor="middle" font-size="18" fill="#1b1f2a" font-weight="bold">A world bigger than the screen</text>
  <rect x="40" y="60" width="384.0" height="256.0" fill="#f1faee" stroke="#1d3557" stroke-width="2.5"/>
  <text x="232.0" y="338.0" text-anchor="middle" font-size="13" fill="#1d3557">the world: 60 x 40 tiles = 1920 x 1280 pixels</text>
  <text x="232.0" y="356.0" text-anchor="middle" font-size="11.5" fill="#2a9d8f" font-family="Menlo, Consolas, monospace">physics.world.setBounds and camera.setBounds(0, 0, 1920, 1280)</text>
  <rect x="100.0" y="112.0" width="160.0" height="120.0" fill="#a8dadc" fill-opacity="0.6" stroke="#457b9d" stroke-width="2.5"/>
  <circle cx="180.0" cy="172.0" r="5" fill="#e63946"/>
  <text x="180.0" y="128.0" text-anchor="middle" font-size="11.5" fill="#1d3557" font-weight="bold">main camera: 800 x 600</text>
  <text x="180.0" y="222.0" text-anchor="middle" font-size="11.5" fill="#1d3557">centred on the player</text>
  <rect x="264.0" y="196.0" width="160.0" height="120.0" fill="none" stroke="#f4a261" stroke-width="2" stroke-dasharray="6 4"/>
  <circle cx="400.0" cy="300.0" r="5" fill="#e63946" fill-opacity="0.6"/>
  <text x="344.0" y="244.0" text-anchor="middle" font-size="11" fill="#f4a261">near an edge the camera</text>
  <text x="344.0" y="258.0" text-anchor="middle" font-size="11" fill="#f4a261">stops; the player does not</text>
  <text x="470" y="80" text-anchor="start" font-size="12.5" fill="#1d3557" font-family="Menlo, Consolas, monospace">startFollow(player, true)</text>
  <text x="470" y="100" text-anchor="start" font-size="12.5" fill="#1b1f2a">the camera's scrollX / scrollY change</text>
  <text x="470" y="118" text-anchor="start" font-size="12.5" fill="#1b1f2a">every frame to keep the player centred</text>
  <text x="470" y="160" text-anchor="start" font-size="12.5" fill="#1d3557" font-family="Menlo, Consolas, monospace">setBounds(...)</text>
  <text x="470" y="180" text-anchor="start" font-size="12.5" fill="#1b1f2a">never shows anything outside the map</text>
  <text x="470" y="222" text-anchor="start" font-size="12.5" fill="#1d3557" font-family="Menlo, Consolas, monospace">hud.setScrollFactor(0)</text>
  <text x="470" y="242" text-anchor="start" font-size="12.5" fill="#1b1f2a">stays in the same place on screen</text>
  <rect x="470" y="280" width="153.60000000000002" height="102.4" fill="#000000" stroke="#1d3557" stroke-width="2"/>
  <rect x="470" y="280" width="153.60000000000002" height="102.4" fill="#f1faee" fill-opacity="0.25"/>
  <rect x="494.0" y="300.8" width="64.0" height="48.0" fill="none" stroke="#457b9d" stroke-width="1.5"/>
  <circle cx="526.0" cy="324.8" r="3.5" fill="#e63946"/>
  <text x="640" y="300" text-anchor="start" font-size="12.5" fill="#1b1f2a">a second camera,</text>
  <text x="640" y="318" text-anchor="start" font-size="12.5" fill="#1b1f2a">zoom 0.1: the</text>
  <text x="640" y="336" text-anchor="start" font-size="12.5" fill="#1b1f2a">whole world in</text>
  <text x="640" y="354" text-anchor="start" font-size="12.5" fill="#1b1f2a">192 x 128 pixels</text>
  <text x="470" y="408" text-anchor="start" font-size="11.5" fill="#2a9d8f" font-family="Menlo, Consolas, monospace">cameras.add(x, y, 192, 128)</text>
</svg>
