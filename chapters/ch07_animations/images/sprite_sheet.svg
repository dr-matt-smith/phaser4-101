<rect x="28" y="286" width="724" height="32" rx="4" fill="#1d3557"/>
<text x="390" y="307" font-size="14" fill="#f1faee" text-anchor="middle" font-family="Courier New, monospace">generateFrameNumbers("hero", { start: 2, end: 7 })  -&gt;  frames 2, 3, 4, 5, 6, 7</text>
