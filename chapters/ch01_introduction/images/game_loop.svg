<svg xmlns="http://www.w3.org/2000/svg" width="700" height="400" viewBox="0 0 700 400" font-family="Arial, Helvetica, sans-serif">
  <rect width="700" height="400" fill="#ffffff"/>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1d3557"/></marker></defs>
  <text x="350" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#1b1f2a">One frame of the game loop - about 60 times a second</text>
  <rect x="250" y="60" width="200" height="60" rx="12" fill="#a8dadc" stroke="#1d3557" stroke-width="2"/>
  <text x="350" y="86" text-anchor="middle" font-size="15" font-weight="bold" fill="#1b1f2a">1. input</text>
  <text x="350" y="106" text-anchor="middle" font-size="12" fill="#1b1f2a">keys and pointer brought up to date</text>
  <rect x="470" y="170" width="210" height="70" rx="12" fill="#a8dadc" stroke="#1d3557" stroke-width="2"/>
  <text x="575" y="196" text-anchor="middle" font-size="15" font-weight="bold" fill="#1b1f2a">2. preUpdate(time, delta)</text>
  <text x="575" y="216" text-anchor="middle" font-size="12" fill="#1b1f2a">on every game object that has one</text>
  <text x="575" y="231" text-anchor="middle" font-size="12" fill="#1b1f2a">(and physics moves bodies)</text>
  <rect x="250" y="290" width="200" height="70" rx="12" fill="#a8dadc" stroke="#1d3557" stroke-width="2"/>
  <text x="350" y="316" text-anchor="middle" font-size="15" font-weight="bold" fill="#1b1f2a">3. update(time, delta)</text>
  <text x="350" y="336" text-anchor="middle" font-size="12" fill="#1b1f2a">on every running scene -</text>
  <text x="350" y="351" text-anchor="middle" font-size="12" fill="#1b1f2a">the game's rules</text>
  <rect x="20" y="170" width="210" height="70" rx="12" fill="#f4a261" stroke="#1d3557" stroke-width="2"/>
  <text x="125" y="196" text-anchor="middle" font-size="15" font-weight="bold" fill="#1b1f2a">4. render</text>
  <text x="125" y="216" text-anchor="middle" font-size="12" fill="#1b1f2a">Phaser draws every visible</text>
  <text x="125" y="231" text-anchor="middle" font-size="12" fill="#1b1f2a">game object - you never do</text>
  <path d="M450 95 C540 100 575 130 575 166" stroke="#1d3557" stroke-width="2.5" fill="none" marker-end="url(#a)"/>
  <path d="M575 240 C575 290 520 322 454 324" stroke="#1d3557" stroke-width="2.5" fill="none" marker-end="url(#a)"/>
  <path d="M250 324 C180 322 125 290 125 244" stroke="#1d3557" stroke-width="2.5" fill="none" marker-end="url(#a)"/>
  <path d="M125 170 C125 130 170 98 246 92" stroke="#1d3557" stroke-width="2.5" fill="none" marker-end="url(#a)"/>
  <text x="350" y="210" text-anchor="middle" font-size="14" fill="#e63946">delta = milliseconds since</text>
  <text x="350" y="228" text-anchor="middle" font-size="14" fill="#e63946">the last frame (~16.7)</text>
</svg>
