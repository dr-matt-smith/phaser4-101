<text x="380" y="330" text-anchor="middle" font-size="13" fill="#1b1f2a">With the sort trick, A B C (no change at all) and B A C turn up twice as often as the other four orders.</text>
<text x="380" y="350" text-anchor="middle" font-size="13" fill="#1b1f2a">Measured in Deno, whose JavaScript engine (V8) is the one inside Chrome.</text>
