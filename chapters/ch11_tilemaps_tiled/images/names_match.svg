<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="800" height="432" viewBox="0 0 800 432" font-family="Arial, Helvetica, sans-serif">
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d3557"/></marker>
<marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e63946"/></marker>

</defs>
<rect width="800" height="432" fill="#ffffff"/>
<text x="160" y="26" font-size="15" fill="#1b1f2a" font-weight="bold" text-anchor="middle">In Tiled</text>
<text x="590" y="26" font-size="15" fill="#1b1f2a" font-weight="bold" text-anchor="middle">In the code</text>
<rect x="20" y="44" width="280" height="28" rx="4" fill="#ffffff" stroke="#2a9d8f" stroke-width="1.5"/>
<text x="30" y="62" font-size="11.5" fill="#457b9d">tileset name</text>
<text x="290" y="62" font-size="13" fill="#1d3557" font-weight="bold" text-anchor="end" font-family="Menlo, Consolas, monospace" xml:space="preserve">"platform_tiles"</text>
<line x1="302" y1="58" x2="342" y2="58" stroke="#1d3557" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="344" y="44" width="440" height="28" rx="4" fill="#ffffff" stroke="#1d3557" stroke-width="1.5"/>
<text x="352" y="62" font-size="11.5" fill="#1b1f2a" font-family="Menlo, Consolas, monospace" xml:space="preserve">map.addTilesetImage("platform_tiles", TILES_KEY)</text>
<rect x="20" y="82" width="280" height="28" rx="4" fill="#ffffff" stroke="#2a9d8f" stroke-width="1.5"/>
<text x="30" y="100" font-size="11.5" fill="#457b9d">tile layer</text>
<text x="290" y="100" font-size="13" fill="#1d3557" font-weight="bold" text-anchor="end" font-family="Menlo, Consolas, monospace" xml:space="preserve">"Background"</text>
<line x1="302" y1="96" x2="342" y2="96" stroke="#1d3557" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="344" y="82" width="440" height="28" rx="4" fill="#ffffff" stroke="#1d3557" stroke-width="1.5"/>
<text x="352" y="100" font-size="11.5" fill="#1b1f2a" font-family="Menlo, Consolas, monospace" xml:space="preserve">map.createLayer("Background", tiles)</text>
<rect x="20" y="120" width="280" height="28" rx="4" fill="#ffffff" stroke="#2a9d8f" stroke-width="1.5"/>
<text x="30" y="138" font-size="11.5" fill="#457b9d">tile layer</text>
<text x="290" y="138" font-size="13" fill="#1d3557" font-weight="bold" text-anchor="end" font-family="Menlo, Consolas, monospace" xml:space="preserve">"Ground"</text>
<line x1="302" y1="134" x2="342" y2="134" stroke="#1d3557" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="344" y="120" width="440" height="28" rx="4" fill="#ffffff" stroke="#1d3557" stroke-width="1.5"/>
<text x="352" y="138" font-size="11.5" fill="#1b1f2a" font-family="Menlo, Consolas, monospace" xml:space="preserve">map.createLayer("Ground", tiles)</text>
<rect x="20" y="158" width="280" height="28" rx="4" fill="#ffffff" stroke="#2a9d8f" stroke-width="1.5"/>
<text x="30" y="176" font-size="11.5" fill="#457b9d">tile property</text>
<text x="290" y="176" font-size="13" fill="#1d3557" font-weight="bold" text-anchor="end" font-family="Menlo, Consolas, monospace" xml:space="preserve">"collides"</text>
<line x1="302" y1="172" x2="342" y2="172" stroke="#1d3557" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="344" y="158" width="440" height="28" rx="4" fill="#ffffff" stroke="#1d3557" stroke-width="1.5"/>
<text x="352" y="176" font-size="11.5" fill="#1b1f2a" font-family="Menlo, Consolas, monospace" xml:space="preserve">ground.setCollisionByProperty({ collides: true })</text>
<rect x="20" y="196" width="280" height="28" rx="4" fill="#ffffff" stroke="#2a9d8f" stroke-width="1.5"/>
<text x="30" y="214" font-size="11.5" fill="#457b9d">object layer</text>
<text x="290" y="214" font-size="13" fill="#1d3557" font-weight="bold" text-anchor="end" font-family="Menlo, Consolas, monospace" xml:space="preserve">"Objects"</text>
<line x1="302" y1="210" x2="342" y2="210" stroke="#1d3557" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="344" y="196" width="440" height="28" rx="4" fill="#ffffff" stroke="#1d3557" stroke-width="1.5"/>
<text x="352" y="214" font-size="11.5" fill="#1b1f2a" font-family="Menlo, Consolas, monospace" xml:space="preserve">map.getObjectLayer("Objects")</text>
<rect x="20" y="234" width="280" height="28" rx="4" fill="#ffffff" stroke="#2a9d8f" stroke-width="1.5"/>
<text x="30" y="252" font-size="11.5" fill="#457b9d">object name</text>
<text x="290" y="252" font-size="13" fill="#1d3557" font-weight="bold" text-anchor="end" font-family="Menlo, Consolas, monospace" xml:space="preserve">"player"</text>
<line x1="302" y1="248" x2="342" y2="248" stroke="#1d3557" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="344" y="234" width="440" height="28" rx="4" fill="#ffffff" stroke="#1d3557" stroke-width="1.5"/>
<text x="352" y="252" font-size="11.5" fill="#1b1f2a" font-family="Menlo, Consolas, monospace" xml:space="preserve">map.findObject("Objects", (obj) =&gt; obj.name === "player")</text>
<rect x="20" y="272" width="280" height="28" rx="4" fill="#ffffff" stroke="#2a9d8f" stroke-width="1.5"/>
<text x="30" y="290" font-size="11.5" fill="#457b9d">object name</text>
<text x="290" y="290" font-size="13" fill="#1d3557" font-weight="bold" text-anchor="end" font-family="Menlo, Consolas, monospace" xml:space="preserve">"coin"</text>
<line x1="302" y1="286" x2="342" y2="286" stroke="#1d3557" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="344" y="272" width="440" height="28" rx="4" fill="#ffffff" stroke="#1d3557" stroke-width="1.5"/>
<text x="352" y="290" font-size="11.5" fill="#1b1f2a" font-family="Menlo, Consolas, monospace" xml:space="preserve">map.createFromObjects("Objects", { name: "coin", ... })</text>
<rect x="20" y="310" width="280" height="28" rx="4" fill="#ffffff" stroke="#2a9d8f" stroke-width="1.5"/>
<text x="30" y="328" font-size="11.5" fill="#457b9d">object property</text>
<text x="290" y="328" font-size="13" fill="#1d3557" font-weight="bold" text-anchor="end" font-family="Menlo, Consolas, monospace" xml:space="preserve">"speed"</text>
<line x1="302" y1="324" x2="342" y2="324" stroke="#1d3557" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="344" y="310" width="440" height="28" rx="4" fill="#ffffff" stroke="#1d3557" stroke-width="1.5"/>
<text x="352" y="328" font-size="11.5" fill="#1b1f2a" font-family="Menlo, Consolas, monospace" xml:space="preserve">getTiledProperty(obj.properties, "speed", 60)</text>
<rect x="20" y="348" width="280" height="28" rx="4" fill="#ffffff" stroke="#2a9d8f" stroke-width="1.5"/>
<text x="30" y="366" font-size="11.5" fill="#457b9d">map property</text>
<text x="290" y="366" font-size="13" fill="#1d3557" font-weight="bold" text-anchor="end" font-family="Menlo, Consolas, monospace" xml:space="preserve">"name"</text>
<line x1="302" y1="362" x2="342" y2="362" stroke="#1d3557" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="344" y="348" width="440" height="28" rx="4" fill="#ffffff" stroke="#1d3557" stroke-width="1.5"/>
<text x="352" y="366" font-size="11.5" fill="#1b1f2a" font-family="Menlo, Consolas, monospace" xml:space="preserve">getTiledProperty(map.properties, "name", ...)</text>
<text x="20" y="400" font-size="12.5" fill="#1b1f2a">Every one is a string, and every one must be spelled exactly the same - capitals included. Get one wrong and</text>
<text x="20" y="418" font-size="12.5" fill="#1b1f2a">Phaser finds nothing: null, an empty list, or a layer that is not there. Keep them as constants in one file.</text>
</svg>
