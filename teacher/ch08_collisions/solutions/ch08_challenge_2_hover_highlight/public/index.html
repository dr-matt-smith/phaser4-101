<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles.css" />
    <title>Hand-made Collisions</title>
  </head>
  <body>
    <main>
      <!-- Phaser creates the game's <canvas> inside this div -->
      <div id="game"></div>

      <section class="controls">
        <h3>Controls</h3>
        <div class="control-grid">
          <kbd>Mouse</kbd>
          <span>Drag a shape</span>
          <kbd>Mouse over</kbd>
          <span>Outline the shape under the pointer</span> <!-- CHALLENGE 2 -->
          <kbd>Space</kbd>
          <span>Test real shapes / bounding boxes only</span>
        </div>
      </section>
    </main>
    <script src="game.js"></script>
  </body>
</html>
