<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles.css" />
    <title>Space Shooter</title>
  </head>
  <body>
    <main>
      <!-- Phaser creates the game's <canvas> inside this div -->
      <div id="game"></div>

      <section class="controls">
        <h3>Controls</h3>
        <div class="control-grid">
          <kbd>&larr; &rarr;</kbd>
          <span>Move the ship</span>
          <kbd>Space</kbd>
          <span>Start; hold to fire; play again</span>
          <kbd>Esc</kbd>
          <span>Title screen (from game over)</span>
        </div>
      </section>
    </main>
    <script src="game.js"></script>
  </body>
</html>
