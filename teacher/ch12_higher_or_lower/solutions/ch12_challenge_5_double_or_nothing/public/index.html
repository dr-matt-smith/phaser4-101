<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles.css" />
    <title>Higher or Lower - Advanced</title>
  </head>
  <body>
    <main>
      <!-- Phaser creates the game's <canvas> inside this div -->
      <div id="game"></div>

      <section class="controls">
        <h3>Controls</h3>
        <div class="control-grid">
          <kbd>Mouse</kbd>
          <span>Click the buttons</span>
          <kbd>H</kbd>
          <span>Guess higher</span>
          <kbd>L</kbd>
          <span>Guess lower</span>
          <kbd>C</kbd>
          <span>Cash out (bank the pot)</span>
          <!-- CHALLENGE 5 -->
          <kbd>D</kbd>
          <span>Double or nothing: red doubles the pot, black loses it</span>
        </div>
      </section>
    </main>
    <script src="game.js"></script>
  </body>
</html>
