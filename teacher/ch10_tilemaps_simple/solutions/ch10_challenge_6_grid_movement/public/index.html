<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles.css" />
    <title>Array Map</title>
  </head>
  <body>
    <main>
      <!-- Phaser creates the game's <canvas> inside this div -->
      <div id="game"></div>

      <section class="controls">
        <h3>Controls</h3>
        <div class="control-grid">
          <!-- CHALLENGE 6 -->
          <kbd>Arrows</kbd>
          <span>Walk one tile (hold to keep walking)</span>
          <kbd>D</kbd>
          <span>Show / hide the tiles that collide</span>
        </div>
      </section>
    </main>
    <script src="game.js"></script>
  </body>
</html>
