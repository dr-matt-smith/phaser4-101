<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles.css" />
    <title>High Score Table</title>
  </head>
  <body>
    <main>
      <!-- Phaser creates the game's <canvas> inside this div -->
      <div id="game"></div>

      <section class="controls">
        <h3>Controls</h3>
        <div class="control-grid">
          <kbd>Space</kbd>
          <span>Start, and play again</span>
          <kbd>Mouse</kbd>
          <span>Click coins and gems before they vanish</span>
          <kbd>A - Z</kbd>
          <span>Type your initials (after a high score)</span>
          <kbd>Backspace</kbd>
          <span>Rub out a letter</span>
          <kbd>Enter</kbd>
          <span>Save your initials</span>
          <!-- CHALLENGE 4 -->
          <kbd>R</kbd>
          <span>Clear the high scores (title screen; Y to confirm)</span>
          <kbd>Esc</kbd>
          <span>Back to the high scores (game over screen)</span>
        </div>
      </section>
    </main>
    <script src="game.js"></script>
  </body>
</html>
