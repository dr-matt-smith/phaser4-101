<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles.css" />
    <title>Music Across Scenes</title>
  </head>
  <body>
    <main>
      <!-- Phaser creates the game's <canvas> inside this div -->
      <div id="game"></div>

      <section class="controls">
        <h3>Controls</h3>
        <div class="control-grid">
          <kbd>Mouse</kbd>
          <span>Click to start; press the buttons; collect the stars</span>
          <kbd>M</kbd>
          <span>Sound on / off (or click the speaker)</span>
          <kbd>Esc</kbd>
          <span>Back to the menu</span>
        </div>
      </section>
    </main>
    <script src="game.js"></script>
  </body>
</html>
